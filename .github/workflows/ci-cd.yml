name: CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    env:
      FORCE_JAVASCRIPT_ACTIONS_TO_NODE24: 'true'
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 26
          cache: npm

      - name: Display system info
        run: |
          node --version
          npm --version
          docker --version
          docker compose version

      - name: Install dependencies
        run: npm ci --verbose

      - name: Run npm audit
        run: npm audit --audit-level=critical

      - name: Run tests
        run: npm run test -- --reporter=verbose

      - name: Run build
        run: npm run build

      - name: Run smoke tests
        run: |
          echo "Running smoke test (signup -> appointment -> AI flow)..."
          rm -rf apps/api/data-smoke/* || true
          bash scripts/smoke-test.sh

      - name: Run Postman MCP integration (mock)
        env:
          POSTMAN_API_KEY: ${{ secrets.POSTMAN_API_KEY }}
        run: |
          echo "Preparing .env.postman from secrets (if available)..."
          if [ -n "$POSTMAN_API_KEY" ]; then
            printf '%s\n' \
              "POSTMAN_API_KEY=$POSTMAN_API_KEY" \
              "POSTMAN_BASE_URL=https://api.postman.com" \
              "MCP_SERVER_HOST=localhost" \
              "MCP_SERVER_PORT=3000" \
              "DEBUG_MCP_POSTMAN=false" \
              "API_REQUEST_TIMEOUT=5000" \
              > FULL-STACK-HEAVY/.env.postman
            echo "Wrote FULL-STACK-HEAVY/.env.postman from secret"
          else
            echo "No POSTMAN_API_KEY secret found; proceeding (test may use committed env file or fail)"
          fi
          if [ -f FULL-STACK-HEAVY/postman-mcp-test.js ]; then
            MCP_AUTO_MOCK=1 node FULL-STACK-HEAVY/postman-mcp-test.js
          else
            echo "Skipping Postman MCP integration: FULL-STACK-HEAVY/postman-mcp-test.js is not present in this repository checkout."
          fi

      - name: Publish Sentry release
        if: github.event_name == 'push' && github.ref == 'refs/heads/main'
        env:
          SENTRY_AUTH_TOKEN: ${{ secrets.SENTRY_AUTH_TOKEN }}
          SENTRY_ORG: ${{ secrets.SENTRY_ORG }}
          SENTRY_PROJECT: ${{ secrets.SENTRY_PROJECT }}
          SENTRY_RELEASE: ${{ github.sha }}
        run: |
          if [ -z "$SENTRY_AUTH_TOKEN" ] || [ -z "$SENTRY_ORG" ] || [ -z "$SENTRY_PROJECT" ]; then
            echo "Skipping Sentry release: missing release secrets."
            exit 0
          fi
          npx --yes @sentry/cli releases new "$SENTRY_RELEASE"
          npx --yes @sentry/cli releases set-commits "$SENTRY_RELEASE" --auto
          npx --yes @sentry/cli releases files "$SENTRY_RELEASE" upload-sourcemaps apps/web/dist/assets --rewrite --url-prefix "~/assets"
          npx --yes @sentry/cli releases finalize "$SENTRY_RELEASE"

      - name: Validate compose files
        run: |
          echo "Validating docker-compose.yml..."
          docker compose config > /tmp/compose.out
          echo "✓ docker-compose.yml is valid"
          echo ""
          echo "Validating docker-compose.prod.yml overlay..."
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /tmp/compose.prod.out
          echo "✓ docker-compose.prod.yml is valid"

      - name: Check build artifacts
        run: |
          echo "API dist files:"
          ls -lh apps/api/dist/ | head -10
          echo ""
          echo "Web dist files:"
          ls -lh apps/web/dist/ | head -10

