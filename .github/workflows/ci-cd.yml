name: CI-CD

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]
    tags:
      - 'v*'

jobs:
  test-and-build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 20
          cache: npm

      - name: Display system info
        run: |
          node --version
          npm --version
          docker --version
          docker compose version

      - name: Install dependencies
        run: npm ci --verbose

      - name: Run tests
        run: npm run test -- --reporter=verbose

      - name: Run build
        run: npm run build

      - name: Validate compose files
        run: |
          echo "Validating docker-compose.yml..."
          docker compose config > /tmp/compose.out
          echo "✓ docker-compose.yml is valid"
          echo ""
          echo "Validating docker-compose.prod.yml overlay..."
          docker compose -f docker-compose.yml -f docker-compose.prod.yml config > /tmp/compose.prod.out
          echo "✓ docker-compose.prod.yml is valid"

      - name: Check build artifacts
        run: |
          echo "API dist files:"
          ls -lh apps/api/dist/ | head -10
          echo ""
          echo "Web dist files:"
          ls -lh apps/web/dist/ | head -10

  docker-publish:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: test-and-build
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Set lowercase repo owner
        run: echo "REPO_OWNER_LOWER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/build-empire-api:latest
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/build-empire-api:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: |
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/build-empire-web:latest
            ghcr.io/${{ env.REPO_OWNER_LOWER }}/build-empire-web:${{ github.sha }}

      - name: Image build summary
        run: |
          echo "✅ Docker images built and pushed successfully"
          echo "API Image: ghcr.io/${{ env.REPO_OWNER_LOWER }}/build-empire-api:latest"
          echo "Web Image: ghcr.io/${{ env.REPO_OWNER_LOWER }}/build-empire-web:latest"

  deploy-notes:
    if: github.event_name == 'push' && github.ref == 'refs/heads/main'
    needs: docker-publish
    runs-on: ubuntu-latest
    steps:
      - name: Set lowercase repo owner
        run: echo "REPO_OWNER_LOWER=$(echo ${{ github.repository_owner }} | tr '[:upper:]' '[:lower:]')" >> $GITHUB_ENV

      - name: Deployment summary
        run: |
          echo "╔════════════════════════════════════════════════════════════════╗"
          echo "║              ✅ BUILD-EMPIRE CI/CD COMPLETE                    ║"
          echo "╚════════════════════════════════════════════════════════════════╝"
          echo ""
          echo "📊 Pipeline Summary:"
          echo "✅ Tests: Passed"
          echo "✅ Build: Successful"
          echo "✅ Docker: Images built and pushed to GHCR"
          echo ""
          echo "🐳 Docker Images Published:"
          echo "  API:  ghcr.io/${{ env.REPO_OWNER_LOWER }}/build-empire-api:latest"
          echo "  Web:  ghcr.io/${{ env.REPO_OWNER_LOWER }}/build-empire-web:latest"
          echo ""
          echo "📚 Deployment Options:"
          echo "  1. Render.com:     npm run deploy:render"
          echo "  2. Fly.io:         npm run deploy:fly"
          echo "  3. DigitalOcean:   npm run deploy:digitalocean"
          echo "  4. AWS:            npm run deploy:aws"
          echo ""
          echo "📖 Documentation:"
          echo "  - QUICK_START.md: Quick reference guide"
          echo "  - DEPLOYMENT.md: Platform-specific deployment guides"
          echo "  - PRODUCTION_CHECKLIST.md: Pre-launch validation"
          echo ""
          echo "✨ All systems ready to deploy! 🚀"
