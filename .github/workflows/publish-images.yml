name: Publish Docker Images

on:
  push:
    tags: [ 'v*', ]
  workflow_dispatch:

jobs:
  build-and-push:
    runs-on: ubuntu-latest
    permissions:
      contents: read
      packages: write
      id-token: write

    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Set lowercase owner output
        id: vars
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=$OWNER_LOWER" >> $GITHUB_OUTPUT

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v2

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v2

      - name: Login to GitHub Container Registry
        uses: docker/login-action@v2
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          # Prefer a user-provided PAT with packages:write scope stored in `GHCR_PAT`.
          # Fall back to the builtin `GITHUB_TOKEN` if `GHCR_PAT` is not set.
          password: ${{ secrets.GHCR_PAT || secrets.GITHUB_TOKEN }}

      - name: "Debug: print resolved image tags and env"
        run: |
          echo "OWNER=$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')"
          echo "API_TAGS=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/build-empire-api:latest,ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/build-empire-api:${{ github.sha }}"
          echo "WEB_TAGS=ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/build-empire-web:latest,ghcr.io/$(echo '${{ github.repository_owner }}' | tr '[:upper:]' '[:lower:]')/build-empire-web:${{ github.sha }}"
          env | sort

      - name: Build and push API image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/api/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner_lower }}/build-empire-api:latest,ghcr.io/${{ steps.vars.outputs.owner_lower }}/build-empire-api:${{ github.sha }}

      - name: Build and push Web image
        uses: docker/build-push-action@v5
        with:
          context: .
          file: apps/web/Dockerfile
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner_lower }}/build-empire-web:latest,ghcr.io/${{ steps.vars.outputs.owner_lower }}/build-empire-web:${{ github.sha }}
