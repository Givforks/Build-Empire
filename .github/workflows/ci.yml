name: CI

permissions:
  contents: read
  packages: write

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build-and-test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:16-alpine
        ports:
          - 5432:5432
        env:
          POSTGRES_DB: build_empire
          POSTGRES_USER: build_empire
          POSTGRES_PASSWORD: change-me
        options: >-
          --health-cmd="pg_isready -U build_empire -d build_empire"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - name: Checkout
        uses: actions/checkout@v5

      - name: Set lowercase owner output
        id: vars
        run: |
          OWNER_LOWER=$(echo "${{ github.repository_owner }}" | tr '[:upper:]' '[:lower:]')
          echo "owner_lower=$OWNER_LOWER" >> $GITHUB_OUTPUT

      - name: Setup Node.js
        uses: actions/setup-node@v5
        with:
          node-version: '20'

      - name: Install dependencies
        run: npm ci

      - name: Build API
        run: npm run build -w @build-empire/api

      - name: Build Web
        run: npm run build -w @build-empire/web

      - name: Login to GHCR
        uses: docker/login-action@v3
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}

      - name: Build and push API image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/api/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner_lower }}/build-empire-api:${{ github.sha }}

      - name: Build and push web image
        uses: docker/build-push-action@v6
        with:
          context: .
          file: apps/web/Dockerfile
          push: true
          tags: ghcr.io/${{ steps.vars.outputs.owner_lower }}/build-empire-web:${{ github.sha }}

      - name: Run API in background for smoke tests
        run: |
          mkdir -p ./apps/api/data-smoke
          PORT=4010 \
          DATA_DIR=./apps/api/data-smoke \
          JWT_SECRET=smoke-secret-123456 \
          ADMIN_USERNAME=GivenchiCodes \
          ADMIN_PASSWORD='Givenchi1@@@@@' \
          DATABASE_URL=postgresql://build_empire:change-me@localhost:5432/build_empire \
          node ./apps/api/dist/index.js > api-ci.log 2>&1 &
          echo $! > api-ci.pid

      - name: Wait for API healthy
        run: |
          for i in {1..30}; do
            if curl -fsS http://localhost:4010/health >/dev/null 2>&1; then
              echo "API healthy"
              exit 0
            fi
            sleep 1
          done
          echo "API did not become healthy"
          cat api-ci.log || true
          exit 1

      - name: Run smoke checks
        run: |
          set -euo pipefail
          API_PORT=4010
          SIGNUP_JSON=$(curl -sS -X POST "http://localhost:${API_PORT}/api/auth/signup" -H 'Content-Type: application/json' -d '{"email":"ci-smoke@example.com","password":"CiPass123!","fullName":"CI Smoke","preferredDates":[{"date":"2026-08-10","timeSlots":["10:00"]}]}') || true
          TOKEN=$(printf '%s' "$SIGNUP_JSON" | node -e 'const fs=require("fs");try{const d=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(d.token||"")}catch(e){}')
          if [[ -z "$TOKEN" ]]; then
            LOGIN_JSON=$(curl -sS -X POST "http://localhost:${API_PORT}/api/auth/login" -H 'Content-Type: application/json' -d '{"email":"ci-smoke@example.com","password":"CiPass123!"}')
            TOKEN=$(printf '%s' "$LOGIN_JSON" | node -e 'const fs=require("fs");try{const d=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(d.token||"")}catch(e){}')
          fi
          if [[ -z "$TOKEN" ]]; then
            echo "Failed to obtain token"
            cat api-ci.log || true
            exit 1
          fi
          APPOINTMENT_JSON=$(curl -sS -X POST "http://localhost:${API_PORT}/api/appointments" -H 'Content-Type: application/json' -H "Authorization: Bearer ${TOKEN}" -d '{"topic":"CI smoke appointment","preferredDates":[{"date":"2026-08-11","timeSlots":["11:00"]}]}')
          APPOINTMENT_ID=$(printf '%s' "$APPOINTMENT_JSON" | node -e 'const fs=require("fs");try{const d=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(d.id||"")}catch(e){}')
          if [[ -z "$APPOINTMENT_ID" ]]; then
            echo "Failed to create appointment"
            echo "Response: $APPOINTMENT_JSON"
            cat api-ci.log || true
            exit 1
          fi
          AI_JSON=$(curl -sS -X POST "http://localhost:${API_PORT}/api/ai/deepseek" -H 'Content-Type: application/json' -H "Authorization: Bearer ${TOKEN}" -d "{\"appointmentId\":\"${APPOINTMENT_ID}\",\"prompt\":\"CI smoke: summarize meeting\"}")
          ATTACH_COUNT=$(printf '%s' "$AI_JSON" | node -e 'const fs=require("fs");try{const d=JSON.parse(fs.readFileSync(0,"utf8"));process.stdout.write(String((d.attachments||[]).length))}catch(e){process.stdout.write("0")}')
          if [[ "$ATTACH_COUNT" -lt 1 ]]; then
            echo "AI output missing attachments"
            echo "AI response: $AI_JSON"
            cat api-ci.log || true
            exit 1
          fi
          echo "CI smoke test passed. Appointment: $APPOINTMENT_ID"

      - name: Teardown API
        if: always()
        run: |
          if [ -f api-ci.pid ]; then kill "$(cat api-ci.pid)" || true; fi
