services:
  api:
    build:
      context: .
      dockerfile: apps/api/Dockerfile
    container_name: build-empire-api
    environment:
      NODE_ENV: production
      PORT: 4000
      WEB_ORIGIN: http://localhost:8080
      JWT_SECRET: ${JWT_SECRET:-build-empire-dev-secret}
      JWT_EXPIRES_IN: ${JWT_EXPIRES_IN:-8h}
      DATA_DIR: /app/data
      ADMIN_USERNAME: ${ADMIN_USERNAME:-GivenchiCodes}
      ADMIN_PASSWORD: ${ADMIN_PASSWORD:-Givenchi1@@@@@}
      DATABASE_URL: postgresql://${POSTGRES_USER:-build_empire}:${POSTGRES_PASSWORD:-change-me}@postgres:5432/${POSTGRES_DB:-build_empire}
      AUTO_RUN_MIGRATIONS: "true"
      SMTP_HOST: ${SMTP_HOST:-}
      SMTP_PORT: ${SMTP_PORT:-587}
      SMTP_USER: ${SMTP_USER:-}
      SMTP_PASS: ${SMTP_PASS:-}
      SMTP_FROM: ${SMTP_FROM:-no-reply@build-empire.local}
    volumes:
      - build_empire_api_data:/app/data
    expose:
      - "4000"
    depends_on:
      - postgres

  web:
    build:
      context: .
      dockerfile: apps/web/Dockerfile
      args:
        VITE_API_BASE_URL: ""
    container_name: build-empire-web
    depends_on:
      - api
    ports:
      - "8080:80"

  postgres:
    image: postgres:16-alpine
    container_name: build-empire-postgres
    restart: unless-stopped
    environment:
      POSTGRES_DB: ${POSTGRES_DB:-build_empire}
      POSTGRES_USER: ${POSTGRES_USER:-build_empire}
      POSTGRES_PASSWORD: ${POSTGRES_PASSWORD:-change-me}
    volumes:
      - build_empire_pg_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${POSTGRES_USER:-build_empire} -d ${POSTGRES_DB:-build_empire}"]
      interval: 10s
      timeout: 5s
      retries: 6

volumes:
  build_empire_api_data:
  build_empire_pg_data:
